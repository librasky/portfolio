<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dendi Permadi — XR Portfolio</title>

<script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    /* Keeps the image as a fallback/overlay base */
    background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                url('Images/MAG1.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    overflow-x: hidden;
  }

  /* Neural Network Canvas Styling */
  #network-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Sits behind content */
    pointer-events: none;
  }

  .cursor-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(100,150,255,0.2), transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 20px 40px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .header-left h1 {
    margin: 0 0 10px 0;
    font-size: 1.1rem;
    letter-spacing: 1px;
    height: 1.2rem; /* Prevent layout shift during typing */
  }

  .typed-text {
    background: linear-gradient(to right, #fff, #6b8cff);
    -webkit-background-clip: text;
    color: transparent;
    font-weight: bold;
  }

  nav {
    display: flex;
    gap: 20px;
  }

  nav a {
    text-decoration: none;
    color: #fff;
    font-weight: 500;
    opacity: 0.7;
    transition: 0.3s;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  nav a:hover {
    opacity: 1;
    color: #6b8cff;
  }

  .hero {
    text-align: center;
    padding: 60px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .profile-container {
    width: 200px;
    height: 280px;
    margin-bottom: 20px;
  }

  .profile-pic {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20%;
    box-shadow: 0 0 20px rgba(107, 140, 255, 0.4);
  }

  .hero h2 {
    font-size: 3.5rem;
    font-weight: 700;
    margin: 10px 0;
    background: linear-gradient(to right, #6b8cff, #a855f7);
    -webkit-background-clip: text;
    color: transparent;
  }

  .glass {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .bio-section, .bio-sectionA {
    max-width: 1750px;
    margin: 0 auto 40px;
    padding: 30px;
    position: relative;
    z-index: 1;
  }

  .bio-section { text-align: center; }
  .bio-sectionA { text-align: left; }

  footer {
    text-align: center;
    padding: 40px 20px;
    background: rgba(0,0,0,0.4);
    margin-top: 50px;
    position: relative;
    z-index: 1;
  }

  .contact-links a {
    margin: 0 15px;
    text-decoration: none;
    color: #6b8cff;
    font-weight: 600;
  }
</style>
</head>

<body>

<canvas id="network-canvas"></canvas>
<div class="cursor-glow" id="glow"></div>

<header>
  <div class="header-left">
    <h1><span class="typed-text"></span></h1>
  </div>
  <nav>
    <a href="index.html">Projects</a>
    <a href="biography.html">Biography</a>
    <a href="research.html">Research</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="profile-container">
    <img src="Images/Contact.jpg" class="profile-pic" alt="Dendi Permadi">
  </div>
  <h2>Contact</h2>
</section>

<section class="bio-section glass">
  <h3>“Any technology indistinguishable from magic is insufficiently advanced”</h3>
  <p>– Arthur C. Clarke</p>
</section>

<section class="bio-sectionA glass">
  <div style="white-space: pre-line;">
    <h3>Dendi Permadi</h3>
    Email: <a href="mailto:dendimedia@gmail.com" style="color:#6b8cff">dendimedia@gmail.com</a>


    Google Scholar: <a href="https://scholar.google.com/citations?user=V3QARsgAAAAJ&hl=en" target="_blank" style="color:#6b8cff">View Profile</a>
    
    <img src="Images/ProfilePict.jpg" style="margin-top:20px; border-radius: 10px; max-width: 100%;">
  </div>
</section>

<footer id="contact">
  <div class="contact-links">
    <a href="mailto:dendimedia@gmail.com">Email</a>
    <a href="https://Instagram.com/dendipermadi">Instagram</a>
    <a href="https://scholar.google.com/citations?user=V3QARsgAAAAJ&hl=en&oi=ao">Research Page</a>
  </div>
  <p style="margin-top:20px; opacity: 0.5;">&copy; 2026 Dendi Permadi</p>
</footer>

<script>
  // 1. TYPING EFFECT
  var typed = new Typed('.typed-text', {
    strings: [
      'Dendi Permadi | Portfolio.',
      'Contact me.',
      'Reach Out.',
      'Dendi Permadi | Portfolio.',
      'Email.'
    ],
    typeSpeed: 50,
    backSpeed: 30,
    backDelay: 2000,
    loop: true
  });

  // 2. CURSOR GLOW
  const glow = document.getElementById('glow');
  window.onmousemove = e => {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  };

  // 3. NEURAL NETWORK ANIMATION
  const canvas = document.getElementById('network-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = (Math.random() - 0.5) * 0.5;
      this.radius = Math.random() * 2;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
      if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(107, 140, 255, 0.5)';
      ctx.fill();
    }
  }

  function init() {
    particles = [];
    for (let i = 0; i < 80; i++) particles.push(new Particle());
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, index) => {
      p.update();
      p.draw();
      for (let j = index + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (dist < 150) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(107, 140, 255, ${1 - dist / 150})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    });
    requestAnimationFrame(animate);
  }

  init();
  animate();
</script>

</body>
</html>
