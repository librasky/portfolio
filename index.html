<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dendi Permadi — XR Portfolio</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                url('Images/BG1_XRImmersive.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    overflow-x: hidden;
  }

  .cursor-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(100,150,255,0.3), transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 0;
  }

  header {
    display: flex;
    flex-direction: column; /* Stack name and nav vertically on the left */
    align-items: flex-start;
    padding: 20px 40px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .header-left h1 {
    margin: 0 0 10px 0;
    font-size: 1.8rem;
    letter-spacing: 1px;
    background: linear-gradient(to right, #fff, #6b8cff);
    -webkit-background-clip: text;
    color: transparent;
  }

  nav {
    display: flex;
    gap: 20px;
  }

  nav a {
    text-decoration: none;
    color: #fff;
    font-weight: 500;
    opacity: 0.7;
    transition: 0.3s;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  nav a:hover {
    opacity: 1;
    color: #6b8cff;
  }

  .hero {
    text-align: center;
    padding: 60px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .profile-container {
    width: 160px;
    height: 160px;
    margin-bottom: 20px;
  }

  .profile-pic {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #6b8cff;
    box-shadow: 0 0 20px rgba(107, 140, 255, 0.4);
  }

  .hero h2 {
    font-size: 3rem;
    font-weight: 700;
    margin: 10px 0;
    background: linear-gradient(to right, #6b8cff, #a855f7);
    -webkit-background-clip: text;
    color: transparent;
  }

  .tagline {
    font-size: 1.2rem;
    color: #ccc;
    max-width: 700px;
    margin-bottom: 20px;
  }

  .glass {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .bio-section {
    max-width: 800px;
    margin: 0 auto 40px;
    padding: 30px;
    text-align: center;
  }

  .projects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
  }

  .project {
    aspect-ratio: 1 / 1; /* Force Square shape */
    padding: 15px;
    cursor: pointer;
    transition: 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .project:hover {
    transform: translateY(-8px);
    background: rgba(255, 255, 255, 0.12);
  }

  .project-thumb {
    width: 100%;
    height: 70%; /* Image takes up most of the square */
    object-fit: cover;
    border-radius: 10px;
  }

  .project h3 {
    font-size: 1.1rem;
    margin: 10px 0 5px;
    line-height: 1.3;
  }

  .back-btn {
    display: inline-block;
    padding: 12px 28px;
    margin-bottom: 30px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: white;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    border: none;
    transition: 0.3s;
  }

  .detail {
    display: none;
    max-width: 900px;
    margin: auto;
    padding: 40px 20px;
  }

  iframe {
    width: 100%;
    height: 450px;
    border-radius: 20px;
    margin-bottom: 25px;
  }

  footer {
    text-align: center;
    padding: 40px 20px;
    background: rgba(0,0,0,0.4);
    margin-top: 50px;
  }

  .contact-links a {
    margin: 0 15px;
    text-decoration: none;
    color: #6b8cff;
    font-weight: 600;
  }
</style>
</head>

<body>

<div class="cursor-glow" id="glow"></div>

<header>
  <div class="header-left">
    <h1>Dendi Permadi | Portfolio.</h1>

  <nav>
    <a href="index.html">Projects</a>
   <a href="biography.html">Biography</a>
    <a href="research.html">Research</a>
    <a href="contact.html">Contact</a>

</header>

<section class="hero">

    <img src="Images/ProfilePict.jpg" class="profile-pic" alt="Profile Template">

  <h2>Immersive XR Designer & Researcher</h2>
  <p class="tagline">Exploring spatial interfaces, AI systems, and human-centered XR experiences.</p>
</section>



<section class="projects" id="projects"></section>

<section id="detail" class="detail">
  <button class="back-btn" onclick="goBack()">← Back to Projects</button>
  <h2 id="detail-title"></h2>
  <iframe id="detail-video" src="" allowfullscreen></iframe>
  <div class="panel glass" style="padding:20px; margin-top:10px;">
    <strong>Research | Project Focus:</strong> <p id="detail-research"></p>
    <strong>Publication | Details:</strong> <p id="detail-outcome"></p>
  </div>
</section>

<section id="biography" class="bio-section glass">
  
</section>

<footer id="contact">
  <div class="contact-links">
    <a href="mailto:dendimedia@gmail.com">Email</a>
    <a href="https://Instagram.com/dendipermadi">Instagram</a>
    <a href="https://scholar.google.com/citations?user=V3QARsgAAAAJ&hl=en&oi=ao">Research Page</a>
  </div>
  <p style="margin-top:20px; opacity: 0.5;">&copy; 2026 Dendi Permadi</p>
</footer>

<script>

const videoURL6 = "https://www.youtube.com/embed/XJOr_MDfhhA";

const projects = [
  {
    title: "CARDIOPULMONARY RESUSCITATION: Enhancing Practical Skills with VR",
    image: "Images/CPR2.jpg",
    video: videoURL1,
    research: "Collaboration with International Medical University (IMU) Malaysia. Virtual Reality (VR) uses 3D graphics and interactive devices to immerse users in virtual environments, enabling safe fails crucial for student learning and patient safety. Its popularity aligns with digital-native students preferences. The Ministry of Health mandates CPR competency for all healthcare personnel based on international guidelines. Conventional CPR instruction with task trainer manikins focuses on technical skills but fails to represent realistic emergencies, leaving trainees unprepared. VR can simulate high-stress conditions, but existing VR CPR training software lacks technical precision. We created a combination of VR immersive simulations and task trainers haptic feedback, offering unlimited practice and enhancing comprehension and retention in realistic settings. Based on Kolb's constructivist and experiential learning theories, it encourages active exploration, reflection, conceptualisation, and practical experience. Using the CIPP framework, VR-CPR integrates immersive simulations with tactile feedback to enhance learning outcomes. Feedback is positive, but challenges like technical issues and faculty training need to remain. Future research should compare VR with conventional methods and address long-term retention.",
    outcome: "Fei, S. C., Khim, G. L., Permadi, D., Aroksamy, J. A., Li, L. J., & Kumarasan, D. K. (2024). INNOVATING CARDIOPULMONARY RESUSCITATION EDUCATION: ENHANCING PRACTICAL SKILLS WITH VIRTUAL REALITY. International E-Journal of Science, Medicine & Education, 18."
  },
  {
    title: "AIRCRAFT MAINTANANCE: Immersive VR Training Simulation",
    image: "Images/MAG.jpg",
    video: videoURL2,
    research: "Traditional training in aircraft maintenance struggles to meet the demands of modern aviation. Thus, in a collaboration with Malaysia Airlines Berhad Engineering Service, an immersive VR Training Simulation application was designed and developed to elevate the competencies of aircraft maintenance personnel. The simulator enables repeated practice without wear and tear on physical aircraft components, allowing scalable and consistent learning experiences across training cohorts. The simulator transforms aviation training by advancing safety, precision, and operational performance.",
    outcome: "Addressing the shortage of skilled trainers and ensuring procedural accuracy."
  },
  {
    title: "INCLUSIVE CULTURAL HERITAGE: the Case Study of Serralunga D'alba Castle",
    image: "Images/Serralunga.jpg",
    video: videoURL3,
    research: "Collaboration with drawing TO the future, Politechnico Di Torino Italy. Natural sites, monuments and historical artefacts are Cultural Heritage that must be properly managed to ensure their safeguard. Institutions and corporate body devoted to the Cultural Heritage management have the essential task of supervising them paying particular attention to their conservation, dissemination and fruition. In this regards, digital technologies through ICT (Information and Communication Technologies) and New Media represent useful tools which have to be used in suitable way. In this context, this contribution shares the methodology adopted for the case study of Serralunga d’Alba castle. In particular, the research project shows the process used for getting the digital model of the castle through HBIM (Historic Building Information Modeling) methodology and the development of a VR (Virtual Reality) model tour. The final project obtained is the result of a methodological approach that aimed to optimize time, costs and efforts.",
    outcome: "Ruffino, P. A., Permadi, D., Gandino, E., Haron, A., Osello, A., & Wong, C. O. (2019). Digital technologies for inclusive cultural heritage: The case study of serralunga d’alba castle. ISPRS Annals of the Photogrammetry, Remote Sensing and Spatial Information Sciences, 4, 141-147."
  },
 {
    title: "SPATIAL DESIGN: Immersive Virtual Environments",
    image: "Images/VE.jpg",
    video: videoURL4,
    research: "My approach to spatial design centers on the creation of high-fidelity, interactive virtual environments that bridge the gap between physical architecture and digital interaction.",
    outcome: "Virtual Environment Design."
  },

  {
    title: "DIGITAL TWIN: The Development of VR Model for Digital Home",
    image: "Images/Digitaltwin.jpg",
    video: videoURL5,
    research: "Remote collaborative MR environments.",
    outcome: "Enhanced team spatial coordination."

  {

    image: "Images/VR_art.jpg",
    video: videoURL6,
    research: "Project with my Final Year Students",
    outcome: "Prototype for tactile XR feedback."
  },
  {
    title: "ANCIENT MALAY HERITAGE: Virtual Reality Game Hikayat Hang Tuah",
    image: "Images/HangTuah.jpg",
    video: videoURL7,
    research: "Inclusive navigation in smart cities.",
    outcome: "Urban mobility accessibility model."
  },
  {
    title: "FRENCH LANGUAGE LEARNING: Immersive AR/VR for Educating Vocabulary",
    image: "Images/French.jpg",
    video: videoURL8,
    research: "Human-centered AI in 3D spaces.",
    outcome: "Advanced UI for spatial computing."
  },
 {
    title: "MOBILE AUGMENTED REALITY: Learning Islamic Dua Application for Kids",
    image: "Images/Dailydua.jpg",
    video: videoURL9,
    research: "Human-centered AI in 3D spaces.",
    outcome: "Advanced UI for spatial computing."
  },
{
    title: "PARK AND RIDES SIMULATION: The Rig Virtual Reality",
    image: "Images/Therig.jpg",
    video: videoURL10,
    research: "Immersive Virtual Reality platform. While the park is still under development, you can explore its thrilling rides, breathtaking attractions, and unique features firsthand through our interactive VR experience. This isnt just a preview. its a journey into the future. With our VR technology, you can feel the excitement, visualize the possibilities, and immerse yourself in the magic of whats to come. Get ready to see the impossible become reality",
    outcome: "Client : Holovis UK, Year : 2022."
  },
{
    title: "CONFINED SPACE SAFETY: Authorised Entrant & Standby Person in VR",
    image: "Images/AIV.jpg",
    video: videoURL11,
    research: "Human-centered AI in 3D spaces.",
    outcome: "Advanced UI for spatial computing."
  },


];

const container = document.getElementById("projects");
projects.forEach((p, i) => {
  const div = document.createElement("div");
  div.className = "project glass";
  div.innerHTML = `
    <img src="${p.image}" class="project-thumb">
    <h3>${p.title}</h3>
  `;
  div.onclick = () => openProject(i);
  container.appendChild(div);
});

function openProject(i) {
  document.getElementById('projects').style.display = 'none';
  document.getElementById('biography').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  const p = projects[i];
  document.getElementById('detail-title').innerText = p.title;
  document.getElementById('detail-video').src = p.video;
  document.getElementById('detail-research').innerText = p.research;
  document.getElementById('detail-outcome').innerText = p.outcome;
  window.scrollTo(0,0);
}

function goBack() {
  document.getElementById('projects').style.display = 'grid';
  document.getElementById('biography').style.display = 'block';
  document.getElementById('detail').style.display = 'none';
  document.getElementById('detail-video').src = "";
}

document.addEventListener('mousemove', e => {
  const glow = document.getElementById('glow');
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});
</script>

</body>
</html>
