<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dendi Permadi — XR Portfolio</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:
    linear-gradient(rgba(255,255,255,0.7),rgba(255,255,255,0.9)),
    url('https://images.unsplash.com/photo-1604079628040-94301bb21b91?q=80&w=1600') center/cover no-repeat;
  overflow:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(10px);
  z-index:10;
}

header a{
  margin-right:12px;
  text-decoration:none;
  color:#333;
  font-size:13px;
}

/* HERO */
.hero{
  position:absolute;
  top:60px;
  width:100%;
  height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero-content{
  background:rgba(255,255,255,0.7);
  padding:20px 30px;
  border-radius:16px;
  backdrop-filter:blur(8px);
  text-align:center;
}

.hero h2{
  margin:0;
  font-size:28px;
}

.hero p{
  margin:6px 0 0;
  color:#555;
}

/* GAZE */
.gaze{
  position:fixed;
  width:220px;
  height:220px;
  background:radial-gradient(circle,rgba(120,160,255,0.15),transparent 65%);
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:1;
  will-change:transform;
}

/* SPACE */
.space{
  width:100vw;
  height:100vh;
  position:relative;
}

/* WINDOW */
.window{
  position:absolute;
  width:320px;
  background:rgba(255,255,255,0.65);
  backdrop-filter:blur(10px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.5);
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
  cursor:grab;
  transition:transform 0.25s ease;
}

.window.expanded{
  width:70vw;
  height:70vh;
  transform:translate(15vw,15vh);
  z-index:9999;
}

.titlebar{
  padding:10px;
  font-weight:600;
}

.content{
  padding:10px;
}

.thumbnail{
  width:100%;
  height:120px;
  border-radius:10px;
  background:#ddd;
  background-size:cover;
  background-position:center;
  margin-bottom:10px;
}

iframe{
  width:100%;
  height:180px;
  border:none;
  border-radius:12px;
}

/* FOOTER (bottom-left) */
.footer{
  position:fixed;
  bottom:15px;
  left:20px;
  font-size:12px;
  color:#444;
}

.footer a{
  margin-right:10px;
  text-decoration:none;
  color:#333;
}
</style>
</head>

<body>

<header>
  <div><b>Dendi Permadi</b></div>
</header>

<div class="hero">
  <div class="hero-content">
    <h2>XR Designer & Immersive Researcher</h2>
    <p>Exploring spatial interfaces, AI systems, and human-centered XR experiences.</p>
  </div>
</div>

<div class="gaze" id="gaze"></div>
<div class="space" id="space"></div>

<!-- FOOTER -->
<div class="footer">
  <a href="#">Biography</a>
  <a href="#">Research</a>
  <a href="#">Projects</a> |
  <a href="https://instagram.com" target="_blank">Instagram</a>
  <a href="mailto:your@email.com">Email</a>
  <a href="#">Research Profile</a>
  <div>© 2026 Dendi Permadi</div>
</div>

<script>

const video="https://www.youtube.com/embed/AW8BPzwi0J4";

const images=[
"https://images.unsplash.com/photo-1581091012184-5c6b8c8a5f06?q=80&w=800",
"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=800",
"https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=800",
"https://images.unsplash.com/photo-1492724441997-5dc865305da7?q=80&w=800",
"https://images.unsplash.com/photo-1535223289827-42f1e9919769?q=80&w=800",
"https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?q=80&w=800",
"https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=800"
];

const projects=[
"XR Wayfinding",
"VR Training",
"AI XR Assistant",
"MR Collaboration",
"Haptic Interface",
"Urban XR",
"XR Prototype"
];

const space=document.getElementById("space");

projects.forEach((title,i)=>{
  const win=document.createElement("div");
  win.className="window";

  let posX=100+i*40;
  let posY=300+i*30;

  win.style.transform=`translate(${posX}px,${posY}px)`;

  win.innerHTML=`
    <div class="titlebar">${title}</div>
    <div class="content">
      <div class="thumbnail" style="background-image:url(${images[i]})"></div>
      <iframe src="${video}" allowfullscreen></iframe>
      <p>XR research system exploring spatial interaction.</p>
    </div>
  `;

  makeDraggable(win);

  win.addEventListener("click",()=>{
    win.classList.toggle("expanded");
  });

  space.appendChild(win);
});

/* DRAG (SMOOTH) */
function makeDraggable(el){
  let offsetX=0,offsetY=0,isDown=false;
  let currentX=0,currentY=0,targetX=0,targetY=0,ticking=false;

  el.addEventListener("mousedown",e=>{
    isDown=true;
    offsetX=e.clientX-currentX;
    offsetY=e.clientY-currentY;
    el.style.zIndex=Date.now();
  });

  document.addEventListener("mousemove",e=>{
    if(!isDown) return;

    targetX=e.clientX-offsetX;
    targetY=e.clientY-offsetY;

    if(!ticking){
      requestAnimationFrame(()=>{
        currentX=targetX;
        currentY=targetY;
        el.style.transform=`translate(${currentX}px,${currentY}px)`;
        ticking=false;
      });
      ticking=true;
    }
  });

  document.addEventListener("mouseup",()=>isDown=false);
}

/* GAZE */
const gaze=document.getElementById("gaze");
let mouseX=0,mouseY=0,ticking=false;

window.addEventListener("mousemove",e=>{
  mouseX=e.clientX;
  mouseY=e.clientY;

  if(!ticking){
    requestAnimationFrame(()=>{
      gaze.style.transform=`translate(${mouseX}px,${mouseY}px)`;
      ticking=false;
    });
    ticking=true;
  }
});

</script>

</body>
</html>
